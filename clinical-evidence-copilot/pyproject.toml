[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-evidence-engine"
version = "0.1.0"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE.md", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "The-Veridis-Lion"}]
description = "Evidence-preserving clinical abstraction and deterministic review"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic==2.13.5",
  "langextract==1.7.0",
  "intervaltree==3.2.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
rule-first = ["medspacy==1.3.1", "spacy==3.8.16"]

[project.scripts]
clinical = "clinical_intelligence.cli:main"
clinical-copilot = "clinical_intelligence.copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clinical_intelligence = ["contracts/*.json", "synthetic.json"]
"clinical_intelligence.claims_review" = ["resources/*.json"]
"clinical_intelligence.rule_first" = ["resources/*.json", "resources/*.html"]
"clinical_intelligence.copilot" = ["resources/*.json", "static/*.html", "static/*.css", "static/*.js", "static/workbench/*.html", "static/workbench/*.css", "static/workbench/*.js", "static/gemini/*.html", "static/gemini/*.txt", "static/gemini/assets/*.js", "static/gemini/assets/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
